<text x="1145" y="366" class="small" text-anchor="end">0.148–0.253</text>
<text x="980" y="395" class="small">cli-64</text>
<text x="1145" y="395" class="small" text-anchor="end">0.460–0.999</text>
<text x="980" y="428" class="micro">baseline through +200 KiB</text>
<text x="105" y="626" class="small">The score is a sigmoid output, not a calibrated malware probability. Overlaying bytes changes size and byte-frequency structure together; these observations do not isolate entropy or estimate detection performance.</text>
<text x="105" y="652" class="small">The two source files are treated as paired examples, not independent samples. Source labels and transformations have not been independently validated.</text>

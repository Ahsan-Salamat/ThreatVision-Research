<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="510" viewBox="0 0 1440 510" role="img" aria-labelledby="title desc">
<title id="title">Proposed research roadmap</title><desc id="desc">A proposed six-stage study: recover provenance; establish statistical and static PE baselines; run controlled perturbations; compare raw bigrams with DCT; evaluate static-only and combined systems on shared labeled splits; consider dataset reconstruction only if needed. None is presented as completed.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53687B"/></marker>
 <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168A98"/></marker>
</defs><style>
text { font-family: Arial, Helvetica, sans-serif; fill: #203344; }
.kicker { font-size: 15px; font-weight: 700; letter-spacing: 1.8px; fill: #168A98; }
.figtitle { font-size: 25px; font-weight: 700; fill: #17324D; }
.subtitle { font-size: 15px; fill: #53687B; }
.card { fill: #FFFFFF; stroke: #D2DCE5; stroke-width: 1.5; }
.card-title { font-size: 18px; font-weight: 700; fill: #17324D; }
.body { font-size: 15px; fill: #203344; }
.small { font-size: 13px; fill: #53687B; }
.micro { font-size: 11px; fill: #53687B; }
.num { font-size: 13px; font-weight: 700; fill: white; }
.node { fill: #EEF3F8; stroke: #D2DCE5; stroke-width: 1.5; }
.node-cyan { fill: #EAF5F6; stroke: #A9D5D9; stroke-width: 1.5; }
.node-amber { fill: #FBF3E8; stroke: #E5CCAA; stroke-width: 1.5; }
.edge { fill: none; stroke: #53687B; stroke-width: 2.3; marker-end: url(#arrow); }
.edge-cyan { fill: none; stroke: #168A98; stroke-width: 2.5; marker-end: url(#arrow-cyan); }
.edge-dash { fill: none; stroke: #168A98; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-cyan); }
@media (prefers-color-scheme: dark) {
 text { fill: #E5EEF5; }
 .kicker { fill: #62C2CB; }
 .figtitle, .card-title { fill: #F1F6FA; }
 .subtitle, .body, .small, .micro { fill: #C0CED9; }
 .card, .node { fill: #172A3D; stroke: #52697C; }
 .node-cyan { fill: #12313A; stroke: #388B94; }
 .node-amber { fill: #34291B; stroke: #9B7548; }
 .edge { stroke: #9BAFC0; }
 .edge-cyan, .edge-dash { stroke: #58C7D2; }
 .plot-series-navy, .plot-mark-navy { stroke: #A8C8EE !important; }
 .plot-series-cyan, .plot-mark-cyan { stroke: #62D1DC !important; }
}
</style>
<text x="48" y="42" class="kicker">THREATVISION  /  PROPOSED WORK</text>
<text x="48" y="78" class="figtitle">A sequence of tests that can narrow the question</text>
<text x="48" y="105" class="subtitle">Proposed research only — each stage depends on documented data and provenance.</text>
<rect x="45" y="150" width="410" height="125" rx="14" class="card"/>
<circle cx="75" cy="182" r="17" fill="#168A98"/>
<text x="75" y="187" class="num" text-anchor="middle">01</text>
<text x="105" y="188" class="card-title">Recover provenance</text>
<text x="69" y="228" class="small">Model lineage, preprocessing, labels,</text>
<text x="69" y="250" class="small">sources, and duplicate structure.</text>
<rect x="515" y="150" width="410" height="125" rx="14" class="card"/>
<circle cx="545" cy="182" r="17" fill="#168A98"/>
<text x="545" y="187" class="num" text-anchor="middle">02</text>
<text x="575" y="188" class="card-title">Set simple baselines</text>
<text x="539" y="228" class="small">File size, byte statistics, and pre-specified</text>
<text x="539" y="250" class="small">static PE features.</text>
<rect x="985" y="150" width="410" height="125" rx="14" class="card"/>
<circle cx="1015" cy="182" r="17" fill="#168A98"/>
<text x="1015" y="187" class="num" text-anchor="middle">03</text>
<text x="1045" y="188" class="card-title">Control perturbations</text>
<text x="1009" y="228" class="small">Paired inputs, sham controls, and measured</text>
<text x="1009" y="250" class="small">side effects of each transformation.</text>
<rect x="985" y="315" width="410" height="125" rx="14" class="card"/>
<circle cx="1015" cy="347" r="17" fill="#168A98"/>
<text x="1015" y="352" class="num" text-anchor="middle">04</text>
<text x="1045" y="353" class="card-title">Compare representations</text>
<text x="1009" y="393" class="small">Raw byte bigrams versus DCT features</text>
<text x="1009" y="415" class="small">under the same split.</text>
<rect x="515" y="315" width="410" height="125" rx="14" class="card"/>
<circle cx="545" cy="347" r="17" fill="#168A98"/>
<text x="545" y="352" class="num" text-anchor="middle">05</text>
<text x="575" y="353" class="card-title">Evaluate systems</text>
<text x="539" y="393" class="small">Static-only and combined models on shared,</text>
<text x="539" y="415" class="small">leakage-resistant partitions.</text>
<rect x="45" y="315" width="410" height="125" rx="14" class="card"/>
<circle cx="75" cy="347" r="17" fill="#168A98"/>
<text x="75" y="352" class="num" text-anchor="middle">06</text>
<text x="105" y="353" class="card-title">Reconstruct data if needed</text>
<text x="69" y="393" class="small">Only if lawful existing data cannot support</text>
<text x="69" y="415" class="small">the required provenance and controls.</text>
<path d="M455 212 H500" class="edge-cyan"/>
<path d="M925 212 H970" class="edge-cyan"/>
<path d="M1190 275 V300" class="edge-cyan"/>
<path d="M985 377 H940" class="edge-cyan"/>
<path d="M515 377 H470" class="edge-cyan"/>
<text x="48" y="486" class="small">Primary question: does the byte-bigram/DCT score add information beyond simple file statistics and static PE features?</text>
</svg>